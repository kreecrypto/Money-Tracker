name: Import MVP source
on:
  push:
    paths:
      - 'bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source files
        run: |
          set -euo pipefail
          tar -xJf bootstrap/money-tracker-source.tar.xz -C .
          # GitHub Actions tokens cannot create workflow files; CI will be installed separately
          rm -f .github/workflows/ci.yml
          rm -rf bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: import initial money tracker MVP source"
          git push
