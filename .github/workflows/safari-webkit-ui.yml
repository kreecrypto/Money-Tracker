name: Safari WebKit Visual QA
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/webkit-visual.mjs'
      - 'package.json'
      - '.github/workflows/safari-webkit-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install application and Playwright
        run: |
          npm install --no-package-lock
          npm install --no-save --no-package-lock playwright@1.56.0
      - name: Install Safari WebKit browser
        run: npx playwright install --with-deps webkit
      - name: Audit real WebKit rendering
        run: node scripts/webkit-visual.mjs
      - name: Store anonymized viewport screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: money-tracker-webkit-qa
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 7
