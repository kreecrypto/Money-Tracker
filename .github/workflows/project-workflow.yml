name: Project Workflow Contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate required workflow entrypoints
        shell: bash
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s docs/PROJECT_WORKFLOW.md
          test -s .github/pull_request_template.md
          grep -Fq 'docs/PROJECT_WORKFLOW.md' AGENTS.md
          grep -Fq 'PROJECT_WORKFLOW.md' .github/pull_request_template.md
          grep -Fq '00' docs/PROJECT_WORKFLOW.md
          grep -Fq '12' docs/PROJECT_WORKFLOW.md
      - name: Summarize project delivery gates
        if: always()
        shell: bash
        run: |
          {
            echo "## Money Tracker mandatory workflow"
            echo ""
            echo "Read `AGENTS.md` and `docs/PROJECT_WORKFLOW.md` at the start of **every task**."
            echo ""
            echo "00 Prioritize -> 01 Inspect -> 02 Plan/Skills -> 03 Implement -> 04 Tests -> 05 UX/WebKit -> 06 PR/CI -> 07 Preview/Staging -> 08 Real-device/Security -> 09 Approve -> 10 Merge -> 11 Verify Production -> 12 Smoke/Report."
            echo ""
            echo "**This job validates the repository workflow contract only.** Full code CI, OCR image accuracy, authenticated E2E and physical iPhone UAT remain separate gates; never equate this check with their success."
          } >> "$GITHUB_STEP_SUMMARY"
